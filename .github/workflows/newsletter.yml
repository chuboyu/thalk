name: newsletter

on:
  push:
    branches: [main]
    # A ledger-only commit must not re-trigger planning (and GITHUB_TOKEN pushes
    # don't trigger workflows anyway — this is belt-and-suspenders).
    paths-ignore: ['newsletter/**']
  issue_comment:
    types: [created]

# Least privilege: the default token is read-only; jobs widen only what they need.
permissions:
  contents: read

jobs:
  # ── Plan: on every publish, list posts pending a newsletter send and open a
  # review issue with a checkbox per post. No email is sent here.
  plan:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Write invoker service-account key
        run: echo "$THALK_INVOKER_KEY" > "${RUNNER_TEMP}/invoker-key.json"
        env:
          THALK_INVOKER_KEY: ${{ secrets.THALK_INVOKER_KEY }}
      - name: Build plan
        run: node scripts/newsletter-plan.mjs --out="${RUNNER_TEMP}/plan.json" --issue-body="${RUNNER_TEMP}/issue.md"
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/invoker-key.json
          THALK_ADMIN_SECRET: ${{ secrets.THALK_ADMIN_SECRET }}
      - name: Open plan issue (only if there are candidates)
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if grep -q '^- \[' "${RUNNER_TEMP}/issue.md"; then
            gh label create newsletter-plan --color FBCA04 --description "pending newsletter send" --force
            gh issue create \
              --title "Newsletter plan for ${HEAD_SHA:0:7}" \
              --body-file "${RUNNER_TEMP}/issue.md" \
              --label newsletter-plan
          else
            echo "No pending posts — no issue created."
          fi
      - name: Clean up credentials
        if: always()
        run: rm -f "${RUNNER_TEMP}/invoker-key.json"

  # ── Send: triggered by an owner commenting /send or /skip on a plan issue.
  # Gated three ways: owner-only actor check, the newsletter-plan label, and an
  # Environment with required reviewers (the one-tap mobile approval).
  send:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'newsletter-plan') &&
      github.event.comment.author_association == 'OWNER' &&
      (startsWith(github.event.comment.body, '/send') || startsWith(github.event.comment.body, '/skip'))
    runs-on: ubuntu-latest
    environment: newsletter-send
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history so the ledger push can rebase-retry
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Write invoker service-account key
        run: echo "$THALK_INVOKER_KEY" > "${RUNNER_TEMP}/invoker-key.json"
        env:
          THALK_INVOKER_KEY: ${{ secrets.THALK_INVOKER_KEY }}
      - name: Send / skip per the issue checkboxes
        env:
          # Untrusted issue/comment text is passed via env and parsed in Node,
          # never interpolated into a shell.
          THALK_COMMAND: ${{ startsWith(github.event.comment.body, '/send') && 'send' || 'skip' }}
          THALK_ISSUE_BODY: ${{ github.event.issue.body }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/invoker-key.json
          THALK_ADMIN_SECRET: ${{ secrets.THALK_ADMIN_SECRET }}
          THALK_LINK_SECRET: ${{ secrets.THALK_LINK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/send-newsletter.mjs --from-issue | tee "${RUNNER_TEMP}/send.out"
      - name: Commit ledger
        run: |
          if git diff --quiet -- newsletter/sent.jsonl; then
            echo "ledger unchanged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add newsletter/sent.jsonl
          git commit -m "newsletter: record send decisions [skip ci]"
          # The emails already went out; this record MUST land or those posts
          # could be offered again. Retry against a moving main so a concurrent
          # push can't drop it.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push rejected; rebasing onto origin/main (attempt $attempt)"
            git fetch origin main && git rebase origin/main
          done
          echo "::error::could not record newsletter/sent.jsonl after retries"
          exit 1
      - name: Report on the issue and close it
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --body-file "${RUNNER_TEMP}/send.out"
          gh issue close "$ISSUE" --reason completed
      - name: Clean up credentials
        if: always()
        run: rm -f "${RUNNER_TEMP}/invoker-key.json"
